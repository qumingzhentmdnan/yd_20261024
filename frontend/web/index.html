<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeAgent 本地隔离工作台</title><link rel="stylesheet" href="/assets/style.css"><main><h1>SafeAgent 隔离工作台</h1><p>项目以副本导入 VM。密钥仅供本机 Host 代理使用。导入的内容可被 Agent 发送至获准模型服务。</p><form id="setup"><label>Agent<select id="agent"><option>codex</option><option>claude</option></select></label><label>模型服务源站<input id="origin" type="url" placeholder="https://example.com" required></label><label>自定义模型（可留空）<input id="model" placeholder="例如 gpt-6.1-sol"></label><label>API Key<input id="key" type="password" autocomplete="off" required></label><details><summary>可选：远程 MCP 只读工具连接</summary><label>服务名称<input id="mcpRef" placeholder="例如 docs"></label><label>精确 HTTPS 端点<input id="mcpURL" type="url" placeholder="https://example.com/mcp"></label><label>MCP Bearer Token<input id="mcpKey" type="password" autocomplete="off"></label><label>允许的确切工具名（逗号分隔）<input id="mcpTools" placeholder="search,read_document"></label><label><input id="mcpConfirm" type="checkbox">我确认所列工具的业务含义为只读，并授权本次会话调用</label></details><label>Git 项目绝对路径<input id="project" required placeholder="/home/user/project"></label><button id="list" type="button">读取项目候选文件</button><p>默认选择已跟踪且未检出敏感内容的文件；未跟踪文件需手动勾选。筛查无法识别全部秘密。自定义模型和 MCP 配置仅生成到导入副本，不回写项目；若项目存在同名配置，请移除入口中的模型/MCP设置并使用原配置，或先整理项目配置。</p><div id="files"></div><button type="submit">确认文件并启动隔离会话</button></form><p id="status" role="status">尚未启动</p><section><h2>交互终端</h2><p>点击终端可输入；支持方向键、Ctrl-C、回车和粘贴。此入口显示文本终端，复杂 TUI 的布局可能不完整。</p><pre id="terminal" tabindex="0" aria-label="VM终端"></pre><button id="review">停止 Agent 并审核变更</button><button id="stop">中止会话</button></section><section id="reviewBox" hidden><h2>冻结变更审核</h2><pre id="diff"></pre><button id="apply">确认全部回写宿主项目</button><button id="retain">保留审核副本并结束</button></section></main><script src="/assets/app.js"></script></html>
